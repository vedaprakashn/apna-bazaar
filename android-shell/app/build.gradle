plugins { id "com.android.application"; id "com.google.gms.google-services" }
android {
    namespace "com.heyhood.app"
    compileSdk 35
    defaultConfig { applicationId "com.heyhood.app"; minSdk 26; targetSdk 35; versionCode 2; versionName "1.1" }
    sourceSets { main { manifest.srcFile "../AndroidManifest.xml"; java.srcDirs = ["../src"]; res.srcDirs = ["../res"] } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        pilot { storeFile file(System.getenv("HEYHOOD_KEYSTORE") ?: System.getProperty("user.home") + "/.android/debug.keystore"); storePassword "android"; keyAlias "androiddebugkey"; keyPassword "android" }
    }
    buildTypes { debug { signingConfig signingConfigs.pilot } }
}
dependencies { implementation platform("com.google.firebase:firebase-bom:34.4.0"); implementation "com.google.firebase:firebase-messaging" }
