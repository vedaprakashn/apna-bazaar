<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Hood Plans · HeyHood</title>
    <link rel="stylesheet" href="../app.css?v=20261008-matching1" />
    <link rel="stylesheet" href="../help/help.css?v=20261008-compact1" />
    <link rel="stylesheet" href="plans.css?v=20261008-polish1" />
    <script src="../resident.js?v=1"></script>
    <link rel="stylesheet" href="../hood-actions.css?v=20261008-matching1" />
    <script src="../hood-actions.js?v=20261008-matching1" defer></script>
  </head>
  <body class="plans-page">
    <header class="help-header">
      <a class="module-brand" href="../chatbot/index.html"
        ><img src="../assets/heyhood-logo.png" alt="HeyHood" /></a
      ><select id="community" hidden aria-label="Community">
        <option value="tridasa">MyHome Tridasa</option>
        <option value="sayuk">MyHome Sayuk</option>
      </select>
    </header>
    <nav class="hood-modules" aria-label="HeyHood modules"></nav>
    <script src="../modules.js?v=20261008-matching1" defer></script>
    <main class="plans-main">
      <section class="plans-intro">
        <span class="help-kicker">GOOD PLANS. YOUR PEOPLE.</span>
        <h1>Hood Plans</h1>
        <p>Find your people. Make a plan happen.</p>
        <button id="new-plan" class="save-action" type="button">
          Make a plan +
        </button>
      </section>
      <p class="plans-demo">
        🧪 Demo plans are labelled. Real plans need organiser confirmation.
      </p>
      <div class="plans-filter" role="group" aria-label="Filter plans">
        <button data-filter="all" aria-pressed="true">All plans</button
        ><button data-filter="mine" aria-pressed="false">I’m in</button>
      </div>
      <p id="status" role="status">Loading hood plans…</p>
      <section
        id="plans"
        class="plan-grid"
        aria-label="Community plans"
      ></section>
      <p class="plans-note">
        Live sign-ups use verified resident profiles. A target is interest; the
        organiser confirms the plan. No payment is collected.
      </p>
    </main>
    <script src="plans.js?v=20261008-matching1" defer></script>
  </body>
</html>
