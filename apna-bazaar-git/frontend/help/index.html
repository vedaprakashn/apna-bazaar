<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Help in your hood · HeyHood</title>
    <link rel="stylesheet" href="../app.css?v=20261008-matching1" />
    <link rel="stylesheet" href="help.css?v=20261008-compact1" />
    <script src="../resident.js?v=1"></script>
  </head>
  <body class="help-page">
    <header class="help-header">
      <a href="../chatbot/index.html" class="help-brand"
        ><img src="../assets/heyhood-logo.png" alt="HeyHood" /></a
      ><select id="community" hidden aria-label="Community">
        <option value="tridasa">MyHome Tridasa</option>
        <option value="sayuk">MyHome Sayuk</option>
      </select>
    </header>
    <nav class="hood-modules" aria-label="HeyHood modules"></nav>
    <script src="../modules.js?v=20261008-matching1" defer></script>
    <main class="help-main">
      <section class="urgent-call" aria-labelledby="urgent-title">
        <div>
          <span class="help-kicker">URGENT? GO STRAIGHT TO HELP.</span>
          <h1 id="urgent-title">Help, close by.</h1>
          <p>Emergency? Call 112. Don’t wait for chat.</p>
        </div>
        <a href="tel:112" class="call-112">Call 112 ↗</a>
      </section>
      <p class="directory-demo">
        🧪 Demo contacts · Not verified. WhatsApp opens our test number.
      </p>
      <div class="help-tabs" role="tablist" aria-label="Contact directory">
        <button
          id="urgent-tab"
          role="tab"
          aria-selected="true"
          aria-controls="directory"
        >
          Urgent help</button
        ><button
          id="professional-tab"
          role="tab"
          aria-selected="false"
          aria-controls="directory"
          tabindex="-1"
        >
          People in your hood
        </button>
      </div>
      <div class="help-filters">
        <label class="help-search"
          ><span class="sr-only">Search names, services or areas</span
          ><input
            id="search"
            type="search"
            placeholder="Doctor, lawyer, first aid…" /></label
        ><select id="category" aria-label="Contact category">
          <option value="">All services</option>
        </select>
      </div>
      <p id="section-note">
        Local response contacts. Demo numbers aren’t live.
      </p>
      <p id="status" role="status">Loading contacts…</p>
      <section
        id="directory"
        role="tabpanel"
        aria-labelledby="urgent-tab"
        class="contact-grid"
      ></section>
      <p class="help-footer">
        Hours aren’t live availability. Check before you go.
      </p>
    </main>
    <script src="../contact.js?v=20261007-professional1"></script>
    <script src="help.js?v=20261008-compact1"></script>
  </body>
</html>
