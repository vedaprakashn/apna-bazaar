<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Apna Bazaar</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --swiggy: #FC8019;
    --zomato: #E23744;
    --turmeric: #F4C430;
    --mango: #FF6B35;
    --deep-red: #C0392B;
    --mint: #00B894;
    --mint-light: #E0F7F3;
    --cream: #FFF8F0;
    --card-bg: #FFFFFF;
    --ink: #1A1A2E;
    --subtext: #6B7280;
    --border: #FFE8D6;
    --pill-bg: #FFF3E8;
    --shadow-warm: 0 4px 24px rgba(252,128,25,0.15);
    --shadow-card: 0 2px 16px rgba(0,0,0,0.08);
    --radius: 20px;
    --radius-sm: 12px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--cream);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    max-width: 480px;
    margin: 0 auto;
    position: relative;
    overflow-x: hidden;
  }

  /* ── HEADER ── */
  .header {
    background: linear-gradient(135deg, #FF6B35 0%, #FC8019 50%, #E23744 100%);
    padding: 16px 20px 20px;
    position: sticky;
    top: 0;
    z-index: 50;
    box-shadow: 0 4px 20px rgba(226,55,68,0.3);
  }
  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand-icon {
    width: 42px; height: 42px;
    background: rgba(255,255,255,0.2);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    backdrop-filter: blur(8px);
    border: 1.5px solid rgba(255,255,255,0.35);
  }
  .brand-text h1 {
    font-family: 'Baloo 2', cursive;
    font-size: 22px;
    font-weight: 800;
    color: white;
    line-height: 1;
    letter-spacing: -0.3px;
  }
  .brand-text p {
    font-size: 11px;
    color: rgba(255,255,255,0.85);
    font-weight: 600;
    margin-top: 1px;
  }
  .online-badge {
    display: flex;
    align-items: center;
    gap: 5px;
    background: rgba(255,255,255,0.2);
    border: 1px solid rgba(255,255,255,0.3);
    padding: 5px 10px;
    border-radius: 20px;
    backdrop-filter: blur(8px);
  }
  .online-dot {
    width: 7px; height: 7px;
    background: #00FF88;
    border-radius: 50%;
    animation: pulse-dot 2s infinite;
  }
  @keyframes pulse-dot {
    0%,100% { opacity:1; transform:scale(1); }
    50% { opacity:0.6; transform:scale(1.3); }
  }
  .online-badge span {
    font-size: 11px;
    color: white;
    font-weight: 700;
  }

  /* Quick pills in header */
  .quick-pills {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 2px;
    scrollbar-width: none;
  }
  .quick-pills::-webkit-scrollbar { display: none; }
  .qpill {
    flex-shrink: 0;
    background: rgba(255,255,255,0.2);
    border: 1.5px solid rgba(255,255,255,0.35);
    color: white;
    padding: 7px 14px;
    border-radius: 30px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.18s;
    white-space: nowrap;
    backdrop-filter: blur(4px);
  }
  .qpill:hover, .qpill:active { background: rgba(255,255,255,0.4); transform: scale(0.97); }

  /* ── CHAT AREA ── */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 16px 14px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding-bottom: 120px;
  }
  .chat-area::-webkit-scrollbar { width: 3px; }
  .chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

  /* ── DATE CHIP ── */
  .date-chip {
    text-align: center;
    margin: 4px 0;
  }
  .date-chip span {
    background: #F3E8FF;
    color: #7C3AED;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 14px;
    border-radius: 20px;
  }

  /* ── MESSAGES ── */
  .msg { display: flex; flex-direction: column; animation: popIn 0.28s cubic-bezier(0.175,0.885,0.32,1.275); }
  @keyframes popIn {
    from { opacity:0; transform:translateY(10px) scale(0.96); }
    to   { opacity:1; transform:translateY(0) scale(1); }
  }
  .msg.user { align-items: flex-end; }
  .msg.bot  { align-items: flex-start; }

  .msg-row { display: flex; align-items: flex-end; gap: 8px; }
  .bot-avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: linear-gradient(135deg, #FF6B35, #E23744);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(252,128,25,0.4);
  }

  .bubble {
    max-width: 78%;
    padding: 12px 16px;
    border-radius: 20px;
    font-size: 14px;
    line-height: 1.55;
    font-weight: 600;
  }
  .msg.user .bubble {
    background: linear-gradient(135deg, #FF6B35, #FC8019);
    color: white;
    border-radius: 20px 20px 4px 20px;
    box-shadow: 0 3px 12px rgba(252,128,25,0.35);
  }
  .msg.bot .bubble {
    background: white;
    color: var(--ink);
    border-radius: 20px 20px 20px 4px;
    box-shadow: var(--shadow-card);
    border: 1px solid rgba(0,0,0,0.05);
  }
  .msg-time {
    font-size: 10px;
    color: var(--subtext);
    margin-top: 4px;
    padding: 0 4px;
    font-weight: 600;
  }

  /* ── TYPING ── */
  .typing-indicator {
    display: flex; align-items: flex-end; gap: 8px;
  }
  .typing-bubble {
    background: white;
    border-radius: 20px 20px 20px 4px;
    padding: 14px 18px;
    display: flex; gap: 5px; align-items: center;
    box-shadow: var(--shadow-card);
    border: 1px solid rgba(0,0,0,0.05);
  }
  .typing-bubble span {
    width: 8px; height: 8px;
    background: var(--swiggy);
    border-radius: 50%;
    animation: typeBounce 1.2s infinite;
  }
  .typing-bubble span:nth-child(2) { animation-delay: 0.15s; background: var(--mango); }
  .typing-bubble span:nth-child(3) { animation-delay: 0.3s; background: var(--zomato); }
  @keyframes typeBounce {
    0%,60%,100% { transform:translateY(0); }
    30% { transform:translateY(-6px); }
  }

  /* ── SELLER CARDS ── */
  .seller-cards-wrap {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
    max-width: 320px;
  }

  .seller-card {
    background: white;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: var(--shadow-card);
    border: 1px solid rgba(0,0,0,0.06);
    animation: popIn 0.28s cubic-bezier(0.175,0.885,0.32,1.275);
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .seller-card:active { transform: scale(0.98); }
  .seller-card:hover { box-shadow: var(--shadow-warm); }

  .card-top {
    padding: 14px 14px 10px;
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  .card-emoji-wrap {
    width: 50px; height: 50px;
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
    flex-shrink: 0;
  }
  .card-info { flex: 1; min-width: 0; }
  .card-name {
    font-size: 15px;
    font-weight: 800;
    color: var(--ink);
    font-family: 'Baloo 2', cursive;
    line-height: 1.2;
  }
  .card-shop {
    font-size: 11px;
    color: var(--swiggy);
    font-weight: 700;
    margin-top: 1px;
  }
  .card-flat {
    font-size: 11px;
    color: var(--subtext);
    font-weight: 600;
    margin-top: 3px;
    display: flex;
    align-items: center;
    gap: 3px;
  }
  .card-match {
    font-size: 12px;
    color: var(--ink);
    font-weight: 600;
    line-height: 1.4;
    margin-top: 6px;
    background: #FFF8F0;
    padding: 6px 10px;
    border-radius: 10px;
    border-left: 3px solid var(--swiggy);
  }
  .card-tags {
    display: flex; gap: 5px; flex-wrap: wrap;
    padding: 0 14px 10px;
  }
  .ctag {
    background: var(--mint-light);
    color: var(--mint);
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
  }
  .card-footer {
    border-top: 1px solid #F5F5F5;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .rating-wrap {
    display: flex; align-items: center; gap: 4px;
  }
  .rating-wrap .stars { font-size: 12px; }
  .rating-wrap .score {
    font-size: 12px;
    font-weight: 800;
    color: var(--ink);
  }
  .rating-wrap .count {
    font-size: 11px;
    color: var(--subtext);
    font-weight: 600;
  }
  .wa-btn {
    background: #25D366;
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 30px;
    font-family: 'Nunito', sans-serif;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: all 0.18s;
    box-shadow: 0 2px 8px rgba(37,211,102,0.35);
  }
  .wa-btn:active { transform: scale(0.96); }

  /* ── NO RESULT ── */
  .no-result-card {
    background: white;
    border-radius: 18px;
    padding: 20px;
    max-width: 280px;
    text-align: center;
    box-shadow: var(--shadow-card);
  }
  .no-result-card .emoji { font-size: 36px; margin-bottom: 8px; }
  .no-result-card p { font-size: 13px; color: var(--subtext); font-weight: 600; line-height: 1.5; }

  /* ── DAILY DIGEST CARD ── */
  .digest-card {
    background: linear-gradient(135deg, #FFF3E0, #FFE0CC);
    border-radius: 18px;
    padding: 16px;
    max-width: 300px;
    border: 1.5px solid #FFDAB9;
    box-shadow: var(--shadow-card);
  }
  .digest-title {
    font-family: 'Baloo 2', cursive;
    font-size: 15px;
    font-weight: 800;
    color: var(--ink);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .digest-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 0;
    border-bottom: 1px dashed #FFD0A8;
  }
  .digest-item:last-child { border-bottom: none; }
  .digest-item .di-emoji { font-size: 18px; }
  .digest-item .di-info { flex: 1; }
  .digest-item .di-name { font-size: 12px; font-weight: 800; color: var(--ink); }
  .digest-item .di-desc { font-size: 11px; color: var(--subtext); font-weight: 600; }
  .digest-item .di-price { font-size: 12px; font-weight: 800; color: var(--swiggy); }

  /* ── INPUT BAR ── */
  .input-bar {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 480px;
    background: white;
    padding: 12px 14px 20px;
    border-top: 1px solid #F0F0F0;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
    z-index: 40;
  }
  .input-wrap {
    display: flex;
    gap: 10px;
    align-items: center;
    background: #F8F8F8;
    border-radius: 30px;
    padding: 6px 6px 6px 18px;
    border: 2px solid transparent;
    transition: border 0.2s;
  }
  .input-wrap:focus-within {
    border-color: var(--swiggy);
    background: white;
    box-shadow: 0 0 0 4px rgba(252,128,25,0.1);
  }
  .input-wrap input {
    flex: 1;
    border: none;
    background: transparent;
    font-family: 'Nunito', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
    outline: none;
  }
  .input-wrap input::placeholder { color: #BDBDBD; font-weight: 600; }
  .send-btn {
    width: 42px; height: 42px;
    background: linear-gradient(135deg, #FF6B35, #FC8019);
    border: none;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    cursor: pointer;
    transition: all 0.18s;
    box-shadow: 0 2px 10px rgba(252,128,25,0.4);
    flex-shrink: 0;
  }
  .send-btn:active { transform: scale(0.92); }
  .send-btn:disabled { background: #E0E0E0; box-shadow: none; }

  /* ── WELCOME CARD ── */
  .welcome-card {
    background: white;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: var(--shadow-card);
    max-width: 300px;
  }
  .welcome-banner {
    background: linear-gradient(135deg, #FF6B35, #FC8019, #E23744);
    padding: 18px;
    text-align: center;
  }
  .welcome-banner .big-emoji { font-size: 42px; }
  .welcome-banner h2 {
    font-family: 'Baloo 2', cursive;
    font-size: 20px;
    font-weight: 800;
    color: white;
    margin-top: 6px;
  }
  .welcome-banner p { font-size: 12px; color: rgba(255,255,255,0.9); font-weight: 600; margin-top: 3px; }
  .welcome-body { padding: 14px; }
  .welcome-body p { font-size: 13px; color: var(--subtext); font-weight: 600; line-height: 1.55; }
  .try-chips {
    display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px;
  }
  .try-chip {
    background: var(--pill-bg);
    border: 1.5px solid var(--border);
    color: var(--swiggy);
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.18s;
  }
  .try-chip:active { background: var(--swiggy); color: white; transform: scale(0.96); }

  /* ── SCROLLBAR ── */
  * { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
</style>
</head>

// ── UTILS ──
function getDate() {
  return new Date().toLocaleDateString('en-IN', { weekday:'long', day:'numeric', month:'long' });
}
function getTime() {
  return new Date().toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit' });
}

// ── CLAUDE API ──
async function askClaude(query) {
  const catalog = sellers.map(s => {
    const items = s.catalog.map(c => `    - ${c.item}: ${c.desc}`).join('\n');
    return `SELLER ID:${s.id} | ${s.name} | Shop: ${s.shop} | Flat: ${s.flat}\nCATALOG:\n${items}`;
  }).join('\n\n---\n\n');

  const system = `You are Apna Bazaar's friendly assistant for MyHome Tridasa gated community. You help residents find sellers who stock what they need.

SELLER DATABASE:
${catalog}

Rules:
1. Search semantically across all catalog items — match intent, not just keywords
2. Be warm, peppy, and use food emojis naturally
3. When sellers found: respond with a short enthusiastic intro (1 line max), then JSON
4. When no match: suggest they try a different search or that the category may not have a seller yet
5. Keep intro punchy — like a friendly neighbour, not a corporate bot

ALWAYS use this exact format when sellers found:
<intro>One punchy line here! 🎉</intro>
<sellers>[{"id": <number>, "matchReason": "specific item and why it matches, conversational tone"}]</sellers>

If nothing matches, just reply conversationally — warm, helpful, no JSON.`;

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 1000,
      system,
      messages: [{ role: 'user', content: query }]
    })
  });
  const data = await res.json();
  return data.content[0].text;
}

// ── PARSE ──
function parseResponse(raw) {
  const introMatch = raw.match(/<intro>([\s\S]*?)<\/intro>/);
  const sellersMatch = raw.match(/<sellers>([\s\S]*?)<\/sellers>/);
  const intro = introMatch ? introMatch[1].trim() : null;
  let matched = [];
  if (sellersMatch) {
    try {
      const arr = JSON.parse(sellersMatch[1].trim());
      matched = arr.map(r => ({
        seller: sellers.find(s => s.id === r.id),
        reason: r.matchReason
      })).filter(r => r.seller);
    } catch(e) {}
  }
  return { intro, matched, raw };
}

// ── RENDER ──
const chatArea = document.getElementById('chatArea');

function scrollBottom() {
  setTimeout(() => chatArea.scrollTop = chatArea.scrollHeight, 60);
}

function addUserMsg(text) {
  const el = document.createElement('div');
  el.className = 'msg user';
  el.innerHTML = `<div class="bubble">${text}</div><div class="msg-time">${getTime()}</div>`;
  chatArea.appendChild(el);
  scrollBottom();
}

function addBotBubble(html) {
  const el = document.createElement('div');
  el.className = 'msg bot';
  el.innerHTML = `
    <div class="msg-row">
      <div class="bot-avatar">🛍️</div>
      <div class="bubble">${html}</div>
    </div>
    <div class="msg-time" style="margin-left:40px">${getTime()}</div>`;
  chatArea.appendChild(el);
  scrollBottom();
  return el;
}

function addSellerCards(matched) {
  const wrap = document.createElement('div');
  wrap.className = 'msg bot';
  const inner = document.createElement('div');
  inner.style.marginLeft = '40px';

  const cards = document.createElement('div');
  cards.className = 'seller-cards-wrap';

  matched.forEach(({ seller, reason }) => {
    const card = document.createElement('div');
    card.className = 'seller-card';
    card.innerHTML = `
      <div class="card-top">
        <div class="card-emoji-wrap" style="background:${seller.color}">${seller.emoji}</div>
        <div class="card-info">
          <div class="card-name">${seller.name}</div>
          <div class="card-shop">${seller.shop}</div>
          <div class="card-flat">📍 ${seller.flat}</div>
          <div class="card-match">🎯 ${reason}</div>
        </div>
      </div>
      <div class="card-footer">
        <div class="rating-wrap">
          <span class="stars">⭐</span>
          <span class="score">${seller.rating}</span>
          <span class="count">(${seller.reviews})</span>
        </div>
        <button class="wa-btn" onclick="openWA('${seller.phone}','${seller.name}')">
          <span>💬</span> Order
        </button>
      </div>`;
    cards.appendChild(card);
  });

  inner.appendChild(cards);
  wrap.appendChild(inner);
  chatArea.appendChild(wrap);
  scrollBottom();
}

function addDigest() {
  const digestData = [
    { emoji:'🫓', name:"Lakshmi's Batter", desc:'Dosa, Idli, Ragi — T4·2205', price:'From ₹50' },
    { emoji:'🍱', name:"Akku's Kitchen", desc:'Lunch box special today', price:'₹129/plate' },
    { emoji:'🪷', name:'Shree Vaibhavam', desc:'Bagara Rice + Chicken Iguru', price:'From ₹65' },
    { emoji:'🥤', name:"Meena's Juice Bar", desc:'Fresh mosambi, mango shake', price:'From ₹40' },
    { emoji:'🟢', name:'MP Wala Taste', desc:'Hara Bhara Kabab frozen packs', price:'Home delivery' },
  ];

  const wrap = document.createElement('div');
  wrap.className = 'msg bot';
  wrap.innerHTML = `
    <div class="msg-row">
      <div class="bot-avatar">🛍️</div>
      <div class="digest-card">
        <div class="digest-title">☀️ Today's Sellers are Live!</div>
        ${digestData.map(d => `
          <div class="digest-item">
            <div class="di-emoji">${d.emoji}</div>
            <div class="di-info">
              <div class="di-name">${d.name}</div>
              <div class="di-desc">${d.desc}</div>
            </div>
            <div class="di-price">${d.price}</div>
          </div>`).join('')}
      </div>
    </div>
    <div class="msg-time" style="margin-left:40px">${getTime()}</div>`;
  chatArea.appendChild(wrap);
  scrollBottom();
}

function showTyping() {
  const el = document.createElement('div');
  el.id = 'typing';
  el.className = 'msg bot typing-indicator';
  el.innerHTML = `
    <div class="bot-avatar">🛍️</div>
    <div class="typing-bubble"><span></span><span></span><span></span></div>`;
  chatArea.appendChild(el);
  scrollBottom();
  return el;
}

function openWA(phone, name) {
  const msg = encodeURIComponent(`Hi ${name}! I found you on Apna Bazaar (MyHome Tridasa). I'd like to place an order 🙏`);
  window.open(`https://wa.me/${phone}?text=${msg}`, '_blank');
}

// ── SEND ──
async function sendMsg() {
  const input = document.getElementById('chatInput');
  const btn = document.getElementById('sendBtn');
  const text = input.value.trim();
  if (!text || btn.disabled) return;
  input.value = '';
  btn.disabled = true;

  addUserMsg(text);
  const typing = showTyping();

  try {
    const raw = await askClaude(text);
    typing.remove();
    const { intro, matched } = parseResponse(raw);

    if (intro) addBotBubble(intro);
    if (matched.length > 0) {
      addSellerCards(matched);
      addBotBubble(`Tap <b>Order</b> to WhatsApp them directly! Anything else you're looking for? 😊`);
    } else if (!intro) {
      addBotBubble(raw);
    }
  } catch(e) {
    typing.remove();
    addBotBubble("Oops! Something went wrong 😅 Try again in a moment.");
  }

  btn.disabled = false;
  input.focus();
}

function quickAsk(q) {
  document.getElementById('chatInput').value = q;
  sendMsg();
}

initChat();
