spring:
  application:
    name: apna-bazaar
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:apna_bazaar}
    username: ${DB_USERNAME:apna}
    password: ${DB_PASSWORD:apna123}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Asia/Kolkata
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  ai:
    openai:
      api-key: ${APNA_OPENAI_API_KEY}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4.1-mini}
          max-tokens: 1500
          temperature: 0.7
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# PORT is injected by Railway/Render/Fly.io automatically
server:
  port: ${PORT:${SERVER_PORT:8080}}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.apnabazaar: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN

apna:
  analytics:
    insight-generation-cron: "0 0 2 * * MON"
  broadcast:
    scheduler-interval-ms: 60000
